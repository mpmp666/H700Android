name: H700 official source probe

on:
  push:
    branches: [codex/github-actions-h700]
    paths:
      - 'tools/ci/h700_official_source.py'
      - '.github/workflows/h700-official-source.yml'
  workflow_dispatch:
    inputs:
      download:
        description: 'Download the unique android.tar.gz on this hosted runner and require the locked bytes/MD5/SHA256 (no extraction or archive upload)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: h700-official-source-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  official-source:
    name: Inspect official source names and IDs
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.download && 180 || 15 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare small report and isolated pinned dependency
        run: |
          set -euo pipefail
          report_dir=$(mktemp -d "$RUNNER_TEMP/h700-official-source.XXXXXX")
          printf 'H700_OFFICIAL_REPORT=%s/source.json\n' "$report_dir" >> "$GITHUB_ENV"
          printf 'H700_OFFICIAL_OUTPUT=%s/android.tar.gz\n' "$report_dir" >> "$GITHUB_ENV"
          python3 -m venv "$report_dir/venv"
          "$report_dir/venv/bin/python" -m pip install --no-cache-dir 'gdown==6.5.1'
          printf 'H700_OFFICIAL_PYTHON=%s/venv/bin/python\n' "$report_dir" >> "$GITHUB_ENV"
      - name: List official folder without archive bodies
        if: github.event_name != 'workflow_dispatch' || !inputs.download
        run: |
          "$H700_OFFICIAL_PYTHON" -B tools/ci/h700_official_source.py \
            --json "$H700_OFFICIAL_REPORT"
      - name: Download exact candidate and verify the locked archive
        if: github.event_name == 'workflow_dispatch' && inputs.download
        run: |
          "$H700_OFFICIAL_PYTHON" -B tools/ci/h700_official_source.py \
            --download --output "$H700_OFFICIAL_OUTPUT" \
            --json "$H700_OFFICIAL_REPORT"
      - name: Upload only the small source receipt
        if: always() && env.H700_OFFICIAL_REPORT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h700-official-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.H700_OFFICIAL_REPORT }}
          if-no-files-found: warn
          retention-days: 7
